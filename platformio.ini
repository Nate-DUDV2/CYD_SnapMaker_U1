[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps = 
	bblanchon/ArduinoJson@^7.0.4
	https://github.com/tzapu/WiFiManager.git

build_flags = 
	-D USER_SETUP_LOADED=1
	-D ILI9341_2_DRIVER=1
	-D USE_HSPI_PORT=1
	
	; Screen SPI Pins
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	
	; Silence TFT_eSPI Touch Warning (We use TFT_Touch instead)
	-D TOUCH_CS=-1
	
	; Fonts & Frequencies
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D SPI_FREQUENCY=40000000