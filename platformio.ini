[platformio]
;default_envs = waveshare_43_s3
;default_envs = cyd_40
;default_envs = cyd_28
default_envs = cyd_28_dual_usb

[env]
platform = espressif32@^6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = post:copy_bins.py

; ---> GLOBALLY SHARED LIBRARIES ONLY <---
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  https://github.com/tzapu/WiFiManager.git#v2.0.17
  adafruit/Adafruit BME280 Library @ ^2.2.4
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  adafruit/Adafruit MAX31855 library @ ^1.4.2 ; <--- ADDED THERMOCOUPLE LIBRARY HERE!
  esphome/ESP32-audioI2S@^2.0.7  ; <--- ADDED THE MP3/WAV AUDIO LIBRARY HERE!

; =========================================
; ENVIRONMENT 1: The Original 2.8" CYD
; =========================================
[env:cyd_28]
board_build.partitions = huge_app.csv  ; <--- ADDED MEMORY LIMIT FIX HERE!
build_flags =
  -D BOARD_CYD_28=1
  -D USER_SETUP_LOADED=1
  -D USE_HSPI_PORT=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=27000000
lib_deps =
  ${env.lib_deps}
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/Bodmer/TFT_Touch.git

; =========================================
; ENVIRONMENT 2: 2.8" CYD (Dual-USB Edition)
; =========================================
[env:cyd_28_dual_usb]
board_build.partitions = huge_app.csv  ; <--- ADDED MEMORY LIMIT FIX HERE!
build_flags =
  -DBOARD_CYD_28=1
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT=1
  -DST7789_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=40000000
lib_deps =
  ${env.lib_deps}
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/Bodmer/TFT_Touch.git

; =========================================
; ENVIRONMENT 3: 4.0 INCH DISPLAY
; =========================================
[env:cyd_40]
board_build.partitions = huge_app.csv  ; <--- ADDED MEMORY LIMIT FIX HERE!
build_flags =
  -DBOARD_40_INCH=1
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT=1
  -DST7796_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_ON=1
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=27
  -DTOUCH_CS=33
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
lib_deps =
  ${env.lib_deps}
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/Bodmer/TFT_Touch.git

; =========================================
; ENVIRONMENT 4: WAVESHARE 4.3" S3
; =========================================
[env:waveshare_43_s3]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv ; Ensures the 16MB memory limit is used correctly
build_flags =
  -D BOARD_WAVESHARE_43=1
  -D BOARD_HAS_PSRAM=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  ${env.lib_deps}
  lovyan03/LovyanGFX@^1.1.16
  bitbank2/JPEGDEC          ; ← Added for webcam streaming