[platformio]
; --- CHOOSE YOUR BOARD HERE ---
; Change this to cyd_28 or cyd_40 depending on which screen you are flashing
default_envs = cyd_28

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.31
    https://github.com/Bodmer/TFT_Touch.git
    bblanchon/ArduinoJson @ ^7.0.3
    tzapu/WiFiManager @ ^2.0.16-rc.2

; =========================================
; ENVIRONMENT 1: The Original 2.8" CYD
; =========================================
[env:cyd_28]
build_flags =
    -D BOARD_CYD_28=1
    -D USER_SETUP_LOADED=1
    -D USE_HSPI_PORT=1          
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000

; =========================================
; ENVIRONMENT 2: The New 4.0" Screen
; =========================================
[env:cyd_40]
build_flags =
    -D BOARD_40_INCH=1
    -D USER_SETUP_LOADED=1
    -D USE_HSPI_PORT=1          
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TOUCH_CS=33              
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000 