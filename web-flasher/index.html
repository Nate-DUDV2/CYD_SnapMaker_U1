<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYD Snapmaker Screen Installer</title>
    <style>
        body {
            background-color: #0f1115;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            background-color: #161B22;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #00E5FF;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #00E5FF;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            font-size: 24px;
        }
        p {
            color: #888888;
            line-height: 1.5;
            margin-bottom: 25px;
            font-family: sans-serif;
            font-size: 14px;
        }
        .select-label {
            display: block;
            text-align: left;
            color: #00E5FF;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: #0f1115;
            border: 1px solid #333;
            color: #ffffff;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            box-sizing: border-box;
        }
        select:focus {
            border-color: #00E5FF;
        }
        esp-web-install-button {
            display: block;
            margin: 20px auto;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #555;
        }
    </style>
    <!-- Official ESP Web Tools script -->
    <script type="module" src="https://unpkg.com/esp-web-tools@9.0.1/dist/web/install-button.js?module"></script>
</head>
<body>

    <div class="container">
        <h1>CYD Snapmaker Screen</h1>
        <p>Connect your Cheap Yellow Display (CYD ESP32) to your computer via USB using a data cable. Close any slicers or serial monitors, select your hardware version, and click install.</p>
        
        <!-- Hardware Selection Dropdown -->
        <label class="select-label" for="screen-select">Select Hardware Model:</label>
        <select id="screen-select">
            <option value="manifest_40.json" selected>4.0" CYD Display (ST7796)</option>
            <option value="manifest_28.json">2.8" CYD Display (ILI9341)</option>
        </select>

        <!-- The Flash Button -->
        <esp-web-install-button id="install-btn" manifest="manifest_40.json"></esp-web-install-button>
        
        <div class="footer">
            v2.0.1 Firmware by Nates Print Shop
        </div>
    </div>

    <script>
        const select = document.getElementById('screen-select');
        const installBtn = document.getElementById('install-btn');

        select.addEventListener('change', () => {
            installBtn.setAttribute('manifest', select.value);
        });
    </script>
</body>
</html>
