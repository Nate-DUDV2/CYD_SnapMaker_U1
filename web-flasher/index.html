<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYD Snapmaker Screen Web Flasher</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    body { background: #0b0c10; color: #fff; font-family: monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #12141c; border: 2px solid #00e5ff; border-radius: 12px; padding: 30px; max-width: 500px; text-align: center; box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); }
    h1 { color: #00e5ff; margin-bottom: 10px; font-size: 22px; }
    p { color: #aaa; font-size: 13px; line-height: 1.5; }
    label { display: block; text-align: left; color: #00e5ff; font-weight: bold; margin-top: 25px; margin-bottom: 8px; font-size: 12px; }
    select { width: 100%; padding: 12px; background: #1a1d24; border: 1px solid #333; color: white; border-radius: 6px; font-size: 14px; font-family: inherit; margin-bottom: 25px; cursor: pointer; }
    esp-web-install-button { display: inline-block; margin-top: 10px; }
    .version { margin-top: 30px; font-size: 11px; color: #555; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CYD SNAPMAKER SCREEN</h1>
    <p>Connect your Cheap Yellow Display (CYD ESP32) to your computer via USB using a data cable. Close any slicers or serial monitors, select your hardware version, and click install.</p>
    
    <label for="hardware-select">SELECT HARDWARE MODEL:</label>
    <select id="hardware-select" onchange="updateManifest()">
      <option value="manifest_43.json">4.3" Waveshare ESP32-S3 Display</option>
      <option value="manifest_40.json">4.0" CYD Display (ST7796)</option>
      <option value="manifest_28.json">2.8" CYD Display (ILI9341 Standard)</option>
      <option value="manifest_28_dual_usb.json">2.8" CYD Display (ST7789 Dual-USB)</option>
    </select>

    <!-- Default manifest updated to match the top dropdown option -->
    <esp-web-install-button id="install-btn" manifest="manifest_43.json"></esp-web-install-button>

    <div class="version">v2.0.5 Firmware by Nates Print Shop</div>
  </div>

  <script>
    function updateManifest() {
      const select = document.getElementById('hardware-select');
      const btn = document.getElementById('install-btn');
      btn.setAttribute('manifest', select.value);
    }
  </script>
</body>
</html>
